name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.3.0)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev libusb-1.0-0-dev

      - name: Build release binary
        run: cargo build --release

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: razer-cli-linux-x86_64
          path: target/release/razer-cli
          retention-days: 1

  package:
    name: Package
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: razer-cli-linux-x86_64
          path: target/release/

      - name: Make binary executable
        run: chmod +x target/release/razer-cli

      - name: Install FPM
        run: sudo apt-get install -y ruby ruby-dev build-essential && sudo gem install fpm

      - name: Build .deb
        run: make deb

      - name: Build .rpm
        run: make rpm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb
          path: target/pkg/*.deb
          retention-days: 1
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: target/pkg/*.rpm
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          path: packages/
          merge-multiple: true

      - name: List packages
        run: ls -la packages/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: |
            packages/*.deb
            packages/*.rpm
