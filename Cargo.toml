[package]
name = "razer-laptop-control"
version = "0.3.0"
edition = "2021"
description = "CLI control for Razer laptop fans, power modes and RGB keyboard"

[[bin]]
name = "razer-cli"
path = "src/main.rs"

[lints.clippy]
get_first = "allow"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-big-array = "0.5.1"
clap = { version = "4.4.13", features = ["derive"] }
hidapi = "2.6.6"
bincode = "=1.3"
